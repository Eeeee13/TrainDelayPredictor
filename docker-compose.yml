services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predictor
      POSTGRES_PASSWORD: predictor
      POSTGRES_DB: predictor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor -d predictor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    environment:
      INFERENCE_DATABASE_URL: postgresql+psycopg://inference_ro:inference_ro@postgres:5432/predictor
      MODEL_DIR: /models
    volumes:
      - models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    volumes:
      - ${DATASET_PATH:-./dataset}:/dataset:ro
      - ./emulator_sample_config.json:/emulator_sample_config.json:ro
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://predictor:predictor@postgres:5432/predictor
      APP_REDIS_URL: redis://redis:6379/0
      APP_INFERENCE_URL: http://inference:8000/predict
      APP_EMULATOR_URL: http://emulator:18080
      APP_EMULATOR_CONFIG_PATH: /emulator_sample_config.json
      APP_REPLAY_SCHEDULE_PATH: /dataset/train/schedule.csv
      APP_REPLAY_TRAFFIC_PATH: /dataset/train/traffic.csv
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-b1gv2rfr13cpst5o42jr}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-deepseek-v4-flash/latest}
    ports:
      - "8000:8000"
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_started

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      DATASET_DIR: /dataset
      MODEL_DIR: /models
      PIPELINE_WORK_DIR: /pipeline-work
      TRAIN_REPLAY_SPEED: "6"
    volumes:
      - ${DATASET_PATH:-./dataset}:/dataset:ro
      - models:/models
      - pipeline-work:/pipeline-work

  emulator:
    image: ndtp-telemetry-emulator:1.0
    platform: linux/amd64
    container_name: ndtp-emu
    ports:
      - "18080:18080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  pgdata:
  models:
  pipeline-work:
